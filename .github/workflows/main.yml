name: check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and Playwright
        run: |
          pip install requests playwright
          playwright install chromium

      - name: Run VOX Cinema Checker
        run: python check.py
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Save state
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add seen.json
          git commit -m "update vox showtimes" || true
          git push || true
